name: TelX Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Both build types are signed with the SAME permanent keystore committed in
      # the repo, so every future release installs over the previous version.
      - name: Build signed APKs
        working-directory: android_telx
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp android_telx/app/build/outputs/apk/release/app-release.apk TelX.apk
          cp android_telx/app/build/outputs/apk/debug/app-debug.apk TelX-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelX-APK
          path: |
            TelX.apk
            TelX-debug.apk

      - name: "Publish to GitHub Releases (latest tag)"
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: TelX — Latest Build
          body: |
            🚀 TelX Messenger v7.0 — Liquid Glass UI + Communities, rich text 32k, AI assistant,
            mighty polls, To-Do lists, GIF search, live stories, profile music, group calls,
            passkey fingerprint unlock and much more.

            **Install:** download `TelX.apk`, enable "Install unknown apps", install.
            Updates install directly over any v5.0+ — no uninstall needed anymore.
          artifacts: |
            TelX.apk
            TelX-debug.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
