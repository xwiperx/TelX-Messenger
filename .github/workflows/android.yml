name: TelX Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: android_telx
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android_telx/app/build/outputs/apk/debug/app-debug.apk TelX-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelX-APK
          path: TelX-debug.apk

      - name: Publish to GitHub Releases (tag: latest)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: TelX — Latest Build
          body: |
            🚀 TelX Messenger — fresh debug build (auto-updated on every push to main)

            **Install:** download `TelX-debug.apk`, enable "Install unknown apps", install.
          artifacts: TelX-debug.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
