plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.telx.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.telx.app"
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName "6.0"
    }

    buildFeatures {
        buildConfig true
    }

    // Permanent release signature — the SAME key for every future update,
    // so new versions install directly over the old app (no uninstall needed).
    signingConfigs {
        release {
            storeFile file("../keystore/telx-release.jks")
            storePassword "TelX2026m021"
            keyAlias "telx"
            keyPassword "TelX2026m021"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            // sign debug builds with the release key too, so debug and release
            // builds can replace each other during development
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    // QR codes (Maven Central) — profile QR + scanning from image
    implementation "com.google.zxing:core:3.5.3"
}
